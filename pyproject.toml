[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cards"
version = "0.1.0"
requires-python = ">=3.12"
description = "Local, compact CLI for Anki card build artifacts"
readme = "README.md"
license = {text = "MIT"}
dependencies = ["PyMuPDF==2.1", "pillow==13.0.0", "numpy==2.5.4", "pytesseract==0.3.13", "playwright==1.64.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cards = "cards.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cards" = ["templates/review/*.md", "templates/review/*/*.md", "assets/coldrecall-cloze/*"]
"cards.meter" = ["prices.toml"]
